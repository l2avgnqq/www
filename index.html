<script>

const db = supabase.createClient(
"https://mxwtlfkhykqegzytotlq.supabase.co",
"sb_publishable_-FajhSo3HLdy00i5VNemSA_89bLw5Qp"
);

/* ================= STATE ================= */

let players = {};
let levels = {};

/* ================= HELPERS ================= */

const id = s => encodeURIComponent(s);

const fmt = s => {
    s = Math.max(0, s);
    let h = Math.floor(s / 3600);
    let m = Math.floor((s % 3600) / 60);
    let sec = s % 60;
    return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
};

const left = p => {
    if (!p.running || !p.last_update) return p.time;
    return Math.max(0, p.time - Math.floor((Date.now() - new Date(p.last_update)) / 1000));
};

/* ================= LOAD ================= */

async function load(){
    const {data} = await db.from("timers").select("*");
    players = {};
    (data || []).forEach(p => players[p.id] = p);
}

async function loadLevels(){
    const {data} = await db.from("levels").select("*");
    levels = {};
    (data || []).forEach(p => levels[p.id] = p);
}

/* ================= SAVE ================= */

const save = p => db.from("timers").upsert(p);
const saveLevel = p => db.from("levels").upsert(p);

/* ================= RENDER PLAYERS ================= */

function createRow(p){

    const pid = id(p.id);

    const div = document.createElement("div");
    div.className = "player";
    div.id = "r_" + pid;

    div.innerHTML = `
        <div class="idx"></div>
        <div class="name"></div>
        <div class="time" id="t_${pid}">0</div>
        <div class="actions">
            <button id="b_${pid}"></button>
            <button class="small">+30m</button>
            <button class="small">+1h</button>
            <button class="del">🗑</button>
        </div>
    `;

    div.querySelector(".name").textContent = p.name;

    div.querySelectorAll(".small")[0].onclick = () => add30(p.id);
    div.querySelectorAll(".small")[1].onclick = () => add1h(p.id);
    div.querySelector(".del").onclick = () => removePlayer(p.id);

    document.getElementById("list").appendChild(div);
}

/* ================= RENDER ================= */

function render(){

    document.querySelectorAll(".player").forEach(r=>{
        if(r.id.startsWith("r_")){
            const rid = r.id.replace("r_","");
            if(!players[rid]) r.remove();
        }
    });

    Object.values(players).forEach(p=>{
        const pid = id(p.id);
        if(!document.getElementById("r_"+pid)) createRow(p);
    });
}

/* ================= TICK ================= */

function tick(){

    const arr = Object.values(players)
        .map(p => ({...p, remain:left(p)}))
        .sort((a,b)=>a.remain-b.remain);

    arr.forEach((p,i)=>{

        const pid = id(p.id);
        const row = document.getElementById("r_"+pid);
        if(!row) return;

        document.getElementById("list").appendChild(row);

        row.querySelector(".idx").innerText = i+1;
        document.getElementById("t_"+pid).innerText = fmt(p.remain);

        const btn = document.getElementById("b_"+pid);

        if(p.running){
            btn.innerText = "⏸";
            btn.onclick = () => pausePlayer(p.id);
        } else {
            btn.innerText = "▶";
            btn.onclick = () => resumePlayer(p.id);
        }

        row.classList.remove("warn","danger");
        if(p.remain <= 300) row.classList.add("warn");
        if(p.remain <= 60) row.classList.add("danger");

        row.querySelector(".name").textContent = p.name;
    });
}

/* ================= LEVELS ================= */

function renderLevels(){

    const el = document.getElementById("levelList");
    el.innerHTML = "";

    Object.values(levels)
        .sort((a,b)=>a.lvl_from-b.lvl_from)
        .forEach(p=>{

            const row = document.createElement("div");
            row.className = "player";

            row.innerHTML = `
                <div class="name"></div>
                <div>${p.lvl_from} → ${p.lvl_to}</div>
                <button class="del">🗑</button>
            `;

            row.querySelector(".name").textContent = p.name;
            row.querySelector(".del").onclick = () => removeLevel(p.id);

            el.appendChild(row);
        });
}

/* ================= ACTIONS ================= */

async function addPlayer(){

    const name = nameInput.value.trim();
    const min = parseInt(minInput.value);

    if(!name || Number.isNaN(min)) return;

    const p = {
        id: crypto.randomUUID(),
        name,
        time: min * 60,
        running: true,
        last_update: new Date().toISOString()
    };

    await save(p);
    await load();
    render();
}

async function pausePlayer(id){
    const p = players[id];
    if(!p) return;

    p.time = left(p);
    p.running = false;
    p.last_update = null;

    await save(p);
    await load();
    render();
}

async function resumePlayer(id){
    const p = players[id];
    if(!p) return;

    p.running = true;
    p.last_update = new Date().toISOString();

    await save(p);
    await load();
    render();
}

async function removePlayer(id){
    await db.from("timers").delete().eq("id", id);
    delete players[id];
    render();
}

async function add30(id){
    const p = players[id];
    if(!p) return;

    p.time = left(p) + 1800;
    p.running = true;
    p.last_update = new Date().toISOString();

    await save(p);
    await load();
    render();
}

async function add1h(id){
    const p = players[id];
    if(!p) return;

    p.time = left(p) + 3600;
    p.running = true;
    p.last_update = new Date().toISOString();

    await save(p);
    await load();
    render();
}

/* ================= LEVELS ================= */

async function addLevel(){

    const name = lvlName.value.trim();
    const from = parseInt(lvlFrom.value);
    const to = parseInt(lvlTo.value);

    if(!name || Number.isNaN(from) || Number.isNaN(to)) return;

    const l = {
        id: crypto.randomUUID(),
        name,
        lvl_from: from,
        lvl_to: to
    };

    await saveLevel(l);
    await loadLevels();
    renderLevels();
}

async function removeLevel(id){
    await db.from("levels").delete().eq("id", id);
    delete levels[id];
    renderLevels();
}

/* ================= REALTIME ================= */

db.channel("timers")
.on("postgres_changes",{event:"*",schema:"public",table:"timers"},async()=>{
    await load();
    render();
})
.subscribe();

db.channel("levels")
.on("postgres_changes",{event:"*",schema:"public",table:"levels"},async()=>{
    await loadLevels();
    renderLevels();
})
.subscribe();

/* ================= INIT ================= */

const nameInput = document.getElementById("name");
const minInput = document.getElementById("min");

async function init(){
    await load();
    await loadLevels();
    render();
    renderLevels();
    setInterval(tick, 1000);
}

init();

</script>
