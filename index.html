<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXP L2 AUTO SYNC</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
font-family:Arial;
color:#fff;

/* 🐷 СВИНКА НА ФОН */
background:
linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
url("https://top-mmorpg.ru/uploads/posts/2019-05/1559042975_l2obloj.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;
padding:20px;
}

.layout{display:flex;gap:20px;}
.left{flex:1;}
.right{width:340px;background:#162033cc;padding:15px;border-radius:12px;}

.player{
background:#162033cc;
margin:8px 0;
padding:12px;
border-radius:12px;
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
backdrop-filter: blur(3px);
}

.warn{background:#3a2c00cc}
.danger{background:#4a1010cc}

.idx{width:30px;}
.name{width:140px;font-weight:bold;}
.time{width:120px;font-size:20px;color:#22c55e;}

button{
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

.add{background:#2563eb;color:#fff}
.pause{background:#f59e0b}
.resume{background:#22c55e}
.del{background:#ef4444}
.small{background:#334155;color:#fff}
</style>
</head>

<body>

<div class="layout">

<div class="left">

<h2>EXP L2</h2>

<input id="name" placeholder="Имя">
<input id="min" type="number" placeholder="Мин">
<button class="add" onclick="addPlayer()">Добавить</button>

<br><br>

<input id="all" type="number" placeholder="+ всем">
<button class="add" onclick="addAll()">+ всем</button>
<button class="pause" onclick="pauseAll()">⏸</button>
<button class="resume" onclick="resumeAll()">▶</button>

<br><br>

<div id="list"></div>

</div>

<div class="right">

<h3>Лвл</h3>

<input id="lvlName" placeholder="Ник"><br><br>
<input id="lvlFrom" type="number" placeholder="с лвл">
<input id="lvlTo" type="number" placeholder="до лвл"><br><br>
<button class="add" onclick="addLevel()">Добавить</button>

<hr>

<div id="levelList"></div>

</div>

</div>

<script>

const db = supabase.createClient(
"https://mxwtlfkhykqegzytotlq.supabase.co",
"sb_publishable_-FajhSo3HLdy00i5VNemSA_89bLw5Qp"
);

let players = {};
let levels = {};

/* ===== HELPERS ===== */

const fmt = s => {
s=Math.max(0,s||0);
return `${Math.floor(s/3600)}:${String(Math.floor((s%3600)/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
};

const left = p => {
if(!p.running || !p.last_update) return p.time||0;
return Math.max(0, p.time - Math.floor((Date.now()-new Date(p.last_update))/1000));
};

/* ===== LOAD ===== */

async function load(){
const {data}=await db.from("timers").select("*");
players={};
(data||[]).forEach(p=>players[p.id]=p);
}

async function loadLevels(){
const {data}=await db.from("levels").select("*");
levels={};
(data||[]).forEach(p=>levels[p.id]=p);
}

/* ===== SAVE ===== */

const save = p => db.from("timers").upsert(p);
const saveLevel = p => db.from("levels").upsert(p);

/* ===== RENDER ===== */

function render(){
const list=document.getElementById("list");
list.innerHTML="";

const arr = Object.values(players)
.map(p=>({...p, remain:left(p)}))
.sort((a,b)=>a.remain-b.remain);

arr.forEach((p,i)=>{
const row=document.createElement("div");
row.className="player";

if(p.remain<=300) row.classList.add("warn");
if(p.remain<=60) row.classList.add("danger");

row.innerHTML=`
<div class="idx">${i+1}</div>
<div class="name">${p.name}</div>
<div class="time" id="t_${p.id}"></div>

<button onclick="toggle('${p.id}')">${p.running?"⏸":"▶"}</button>
<button class="small" onclick="add30('${p.id}')">+30m</button>
<button class="small" onclick="add1h('${p.id}')">+1h</button>
<button class="del" onclick="removeP('${p.id}')">🗑</button>
`;

list.appendChild(row);
});
}

function renderLevels(){
const el=document.getElementById("levelList");
el.innerHTML="";

Object.values(levels).forEach(l=>{
const row=document.createElement("div");
row.className="player";
row.innerHTML=`
<div class="name">${l.name}</div>
<div>${l.lvl_from} → ${l.lvl_to}</div>
<button class="del" onclick="removeLevel('${l.id}')">🗑</button>
`;
el.appendChild(row);
});
}

/* ===== TICK ===== */

function tick(){
Object.values(players).forEach(p=>{
const el=document.getElementById("t_"+p.id);
if(el) el.innerText=fmt(left(p));
});
}

/* ===== FIND ===== */

function findByName(name){
return Object.values(players).find(p=>p.name.toLowerCase()===name.toLowerCase());
}

/* ===== ADD PLAYER ===== */

async function addPlayer(){

const name=document.getElementById("name").value.trim();
const min=parseInt(document.getElementById("min").value);

if(!name||isNaN(min)) return;

const existing=findByName(name);

if(existing){
existing.time = left(existing) + min*60;
existing.running = true;
existing.last_update = new Date().toISOString();

players[existing.id]=existing;
render();
await save(existing);
return;
}

const p={
id:crypto.randomUUID(),
name,
time:min*60,
running:true,
last_update:new Date().toISOString()
};

players[p.id]=p;
render();
await save(p);
}

/* ===== ACTIONS ===== */

async function toggle(id){
const p=players[id];
p.time=left(p);
p.running=!p.running;
p.last_update=p.running?new Date().toISOString():null;

render();
await save(p);
}

async function add30(id){
const p=players[id];
p.time=left(p)+1800;
p.running=true;
p.last_update=new Date().toISOString();

render();
await save(p);
}

async function add1h(id){
const p=players[id];
p.time=left(p)+3600;
p.running=true;
p.last_update=new Date().toISOString();

render();
await save(p);
}

async function removeP(id){
delete players[id];
render();
await db.from("timers").delete().eq("id",id);
}

/* ===== MASS ===== */

async function addAll(){
const v=parseInt(document.getElementById("all").value||0);

Object.values(players).forEach(p=>{
p.time=left(p)+(v||0)*60;
p.running=true;
p.last_update=new Date().toISOString();
});

render();
await db.from("timers").upsert(Object.values(players));
}

async function pauseAll(){
Object.values(players).forEach(p=>{
p.time=left(p);
p.running=false;
});

render();
await db.from("timers").upsert(Object.values(players));
}

async function resumeAll(){
Object.values(players).forEach(p=>{
p.running=true;
p.last_update=new Date().toISOString();
});

render();
await db.from("timers").upsert(Object.values(players));
}

/* ===== LEVELS ===== */

async function addLevel(){

const name=document.getElementById("lvlName").value.trim();
const from=parseInt(document.getElementById("lvlFrom").value);
const to=parseInt(document.getElementById("lvlTo").value);

if(!name||isNaN(from)||isNaN(to)) return;

const l={id:crypto.randomUUID(),name,lvl_from:from,lvl_to:to};

levels[l.id]=l;
renderLevels();
await saveLevel(l);
}

async function removeLevel(id){
delete levels[id];
renderLevels();
await db.from("levels").delete().eq("id",id);
}

/* ===== REALTIME ===== */

db.channel("timers")
.on("postgres_changes",{event:"*",schema:"public",table:"timers"},(payload)=>{
const p=payload.new||payload.old;
if(payload.eventType==="DELETE") delete players[p.id];
else players[p.id]=p;
render();
})
.subscribe();

db.channel("levels")
.on("postgres_changes",{event:"*",schema:"public",table:"levels"},(payload)=>{
const l=payload.new||payload.old;
if(payload.eventType==="DELETE") delete levels[l.id];
else levels[l.id]=l;
renderLevels();
})
.subscribe();

/* ===== INIT ===== */

async function init(){
await load();
await loadLevels();
render();
setInterval(tick,1000);
}

init();

</script>

</body>
</html>
