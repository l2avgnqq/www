<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXP L2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
background:#0b1220;
color:#fff;
font-family:Arial;
padding:20px;
}

.top{
text-align:center;
margin-bottom:20px;
}

.players{
max-width:900px;
margin:auto;
}

.player{
background:#162033;
margin:8px 0;
padding:12px;
border-radius:12px;
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.warn{background:#3a2c00}
.danger{background:#4a1010}

.idx{width:30px;color:#94a3b8;font-weight:bold;}
.name{width:140px;font-weight:bold;}
.time{width:120px;font-size:22px;font-weight:bold;color:#22c55e;}

.actions{
margin-left:auto;
display:flex;
gap:6px;
flex-wrap:wrap;
}

input{
padding:8px;
border:none;
border-radius:10px;
background:#111827;
color:white;
width:80px;
}

button{
border:none;
border-radius:10px;
padding:8px 10px;
cursor:pointer;
color:white;
font-weight:bold;
}

.add{background:#2563eb}
.pause{background:#f59e0b}
.resume{background:#22c55e}
.del{background:#ef4444}
.small{background:#334155;font-size:12px}
</style>
</head>

<body>

<div class="top">

<h2>EXP L2</h2>

<input id="name" placeholder="Имя">
<input id="min" type="number" placeholder="Мин">

<button class="add" onclick="addPlayer()">Добавить</button>

</div>

<div id="list" class="players"></div>

<script>

/* ================= SUPABASE ================= */

const db = supabase.createClient(
"https://mxwtlfkhykqegzytotlq.supabase.co",
"sb_publishable_-FajhSo3HLdy00i5VNemSA_89bLw5Qp"
);

/* ================= STATE ================= */

let players = {};

/* ================= HELPERS ================= */

const id = s => s.replace(/[^a-z0-9]/gi,"_");

const fmt = s => {
s=Math.max(0,s);
let h=Math.floor(s/3600);
let m=Math.floor((s%3600)/60);
let sec=s%60;
return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
};

const left = p => {
if(!p.running || !p.last_update) return p.time;
return Math.max(0, p.time - Math.floor((Date.now()-new Date(p.last_update))/1000));
};

/* ================= DB ================= */

async function load(){
let {data}=await db.from("timers").select("*");
players={};
(data||[]).forEach(p=>players[p.name]=p);
}

const save = p => db.from("timers").upsert(p);

/* ================= UI ================= */

function createRow(p){

let pid=id(p.name);

let div=document.createElement("div");
div.className="player";
div.id="r_"+pid;

div.innerHTML=`
<div class="idx"></div>
<div class="name">${p.name}</div>
<div class="time" id="t_${pid}">0</div>

<div class="actions">

<button id="b_${pid}"></button>

<button class="small" onclick="add30('${p.name}')">+30m</button>
<button class="small" onclick="add1h('${p.name}')">+1h</button>

<button class="del" onclick="removePlayer('${p.name}')">🗑</button>

</div>
`;

document.getElementById("list").appendChild(div);
}

/* ================= RENDER ================= */

function render(){

document.querySelectorAll(".player").forEach(r=>{
let rid=r.id.replace("r_","");
let exists=Object.values(players).some(p=>id(p.name)===rid);
if(!exists) r.remove();
});

Object.values(players).forEach(p=>{
let pid=id(p.name);
if(!document.getElementById("r_"+pid)) createRow(p);
});

}

/* ================= LIVE ================= */

function tick(){

Object.values(players).forEach((p,i)=>{

let pid=id(p.name);
let row=document.getElementById("r_"+pid);
if(!row) return;

row.querySelector(".idx").innerText=i+1;
document.getElementById("t_"+pid).innerText = fmt(left(p));

let btn=document.getElementById("b_"+pid);

if(p.running){
btn.innerText="⏸";
btn.className="pause";
btn.onclick=()=>pausePlayer(p.name);
}else{
btn.innerText="▶";
btn.className="resume";
btn.onclick=()=>resumePlayer(p.name);
}

row.classList.remove("warn","danger");
if(left(p)<=300) row.classList.add("warn");
if(left(p)<=60) row.classList.add("danger");

});

}

/* ================= ACTIONS ================= */

async function addPlayer(){

let name=nameInput.value.trim();
let min=parseInt(minInput.value);

if(!name || !min) return;

let p=players[name] || {
name,
time:0,
running:false,
last_update:null
};

p.time = left(p) + min*60;
p.running = true;
p.last_update = new Date().toISOString();

await save(p);
await load();
render();

nameInput.value="";
minInput.value="";
}

async function add30(name){
let p=players[name];
if(!p) return;

p.time = left(p) + 30*60;
p.running = true;
p.last_update = new Date().toISOString();

await save(p);
await load();
render();
}

async function add1h(name){
let p=players[name];
if(!p) return;

p.time = left(p) + 60*60;
p.running = true;
p.last_update = new Date().toISOString();

await save(p);
await load();
render();
}

async function pausePlayer(name){
let p=players[name];
if(!p) return;

p.time = left(p);
p.running = false;
p.last_update = null;

await save(p);
await load();
render();
}

async function resumePlayer(name){
let p=players[name];
if(!p) return;

if(left(p)<=0) return;

p.running = true;
p.last_update = new Date().toISOString();

await save(p);
await load();
render();
}

async function removePlayer(name){
await db.from("timers").delete().eq("name",name);
delete players[name];
render();
}

/* ================= INIT ================= */

const nameInput=document.getElementById("name");
const minInput=document.getElementById("min");

async function init(){
await load();
render();
setInterval(tick,1000);
}

init();

/* ================= REALTIME ================= */

db.channel("timers")
.on("postgres_changes",
{event:"*",schema:"public",table:"timers"},
async ()=>{
await load();
render();
})
.subscribe();

</script>

</body>
</html>
