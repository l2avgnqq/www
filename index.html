<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXP L2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    background:#0b1220;
    color:#fff;
    font-family:Arial;
    padding:20px;
}

.layout{
    display:flex;
    gap:20px;
}

.timers{flex:1;}

.levels{
    width:320px;
    background:#162033;
    padding:15px;
    border-radius:12px;
}

.top{text-align:center;margin-bottom:20px;}

.player{
    background:#162033;
    margin:8px 0;
    padding:12px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:10px;
}

.warn{background:#3a2c00}
.danger{background:#4a1010}

.idx{width:30px;color:#94a3b8;font-weight:bold;}
.name{width:140px;font-weight:bold;}
.time{width:120px;font-size:22px;font-weight:bold;color:#22c55e;}

.actions{
    margin-left:auto;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

input{
    padding:8px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:white;
    width:80px;
}

button{
    border:none;
    border-radius:10px;
    padding:8px 10px;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.add{background:#2563eb}
.pause{background:#f59e0b}
.resume{background:#22c55e}
.del{background:#ef4444}
.small{background:#334155;font-size:12px}
</style>
</head>

<body>

<div class="top">
<h2>EXP L2</h2>
</div>

<div class="layout">

<div class="timers">
<div id="list"></div>
</div>

<div class="levels">
<h3>Прокачка</h3>

<input id="lvlName" placeholder="Нік">
<input id="lvlFrom" type="number" placeholder="З">
<input id="lvlTo" type="number" placeholder="До">

<button class="add" onclick="addLevel()">Додати</button>

<hr>

<div id="levelList"></div>
</div>

</div>

<script>

const db = supabase.createClient(
"https://mxwtlfkhykqegzytotlq.supabase.co",
"sb_publishable_-FajhSo3HLdy00i5VNemSA_89bLw5Qp"
);

let players = {};
let levels = {};

const id = s => s.replace(/[^a-z0-9]/gi,"_");

const fmt = s => {
s=Math.max(0,s);
let h=Math.floor(s/3600);
let m=Math.floor((s%3600)/60);
let sec=s%60;
return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
};

const left = p => {
if(!p.running || !p.last_update) return p.time;
return Math.max(0,p.time - Math.floor((Date.now()-new Date(p.last_update))/1000));
};

/* ---------------- LOAD ---------------- */

async function loadTimers(){
let {data}=await db.from("timers").select("*");
players={};
(data||[]).forEach(p=>players[p.name]=p);
}

async function loadLevels(){
let {data}=await db.from("levels").select("*");
levels={};
(data||[]).forEach(p=>levels[p.name]=p);
}

/* ---------------- SAVE ---------------- */

const saveTimer = p => db.from("timers").upsert(p);
const saveLevel = p => db.from("levels").upsert(p);

/* ---------------- UI ---------------- */

function createRow(p){

let pid=id(p.name);

let div=document.createElement("div");
div.className="player";
div.id="r_"+pid;

div.innerHTML=`
<div class="idx"></div>
<div class="name">${p.name}</div>
<div class="time" id="t_${pid}">0</div>

<div class="actions">

<button id="b_${pid}"></button>

<button class="small" onclick="add30('${p.name}')">+30m</button>
<button class="small" onclick="add1h('${p.name}')">+1h</button>

<button class="del" onclick="removePlayer('${p.name}')">🗑</button>

</div>
`;

document.getElementById("list").appendChild(div);
}

function render(){
document.querySelectorAll(".player").forEach(r=>{
let rid=r.id.replace("r_","");
let exists=Object.values(players).some(p=>id(p.name)===rid);
if(!exists) r.remove();
});

Object.values(players).forEach(p=>{
let pid=id(p.name);
if(!document.getElementById("r_"+pid)) createRow(p);
});
}

/* ---------------- REALTIME TICK ---------------- */

function tick(){

Object.values(players).forEach((p,i)=>{

let pid=id(p.name);
let row=document.getElementById("r_"+pid);
if(!row) return;

document.getElementById("t_"+pid).innerText = fmt(left(p));
row.querySelector(".idx").innerText=i+1;

let btn=document.getElementById("b_"+pid);

if(p.running){
btn.innerText="⏸";
btn.className="pause";
btn.onclick=()=>pause(p.name);
}else{
btn.innerText="▶";
btn.className="resume";
btn.onclick=()=>resume(p.name);
}

row.classList.remove("warn","danger");
if(left(p)<=300) row.classList.add("warn");
if(left(p)<=60) row.classList.add("danger");

});

}

/* ---------------- ACTIONS ---------------- */

async function add30(name){
let p=players[name];
p.time = left(p) + 30*60;
p.running = true;
p.last_update = new Date().toISOString();
await saveTimer(p);
}

async function add1h(name){
let p=players[name];
p.time = left(p) + 60*60;
p.running = true;
p.last_update = new Date().toISOString();
await saveTimer(p);
}

async function pause(name){
let p=players[name];
p.time = left(p);
p.running=false;
p.last_update=null;
await saveTimer(p);
}

async function resume(name){
let p=players[name];
p.running=true;
p.last_update=new Date().toISOString();
await saveTimer(p);
}

async function removePlayer(name){
await db.from("timers").delete().eq("name",name);
delete players[name];
}

/* ---------------- LEVELS ---------------- */

async function addLevel(){
let name=lvlName.value.trim();
let from=parseInt(lvlFrom.value);
let to=parseInt(lvlTo.value);
if(!name||!from||!to) return;

await saveLevel({
name,
lvl_from:from,
lvl_to:to
});
}

/* ---------------- REALTIME ---------------- */

db.channel("timers")
.on("postgres_changes",{event:"*",schema:"public",table:"timers"},async()=>{
await loadTimers();
render();
})
.subscribe();

db.channel("levels")
.on("postgres_changes",{event:"*",schema:"public",table:"levels"},async()=>{
await loadLevels();
renderLevels();
})
.subscribe();

function renderLevels(){
let html="";
Object.values(levels)
.sort((a,b)=>a.lvl_from-b.lvl_from)
.forEach(p=>{
html+=`
<div class="player">
<div class="name">${p.name}</div>
<div>${p.lvl_from} → ${p.lvl_to}</div>
<button class="del" onclick="removeLevel('${p.name}')">🗑</button>
</div>`;
});
levelList.innerHTML=html;
}

async function removeLevel(name){
await db.from("levels").delete().eq("name",name);
delete levels[name];
}

async function init(){
await loadTimers();
await loadLevels();
render();
renderLevels();
setInterval(tick,1000);
}

init();

</script>

</body>
</html>
