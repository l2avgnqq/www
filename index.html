<script>

window.addEventListener("DOMContentLoaded", async () => {

if (typeof supabase === "undefined") {
    document.body.innerHTML = "<h2 style='color:white'>Supabase не загрузился</h2>";
    return;
}

/* ================= SUPABASE ================= */

const db = supabase.createClient(
"https://mxwtlfkhykqegzytotlq.supabase.co",
"sb_publishable_-FajhSo3HLdy00i5VNemSA_89bLw5Qp"
);

/* ================= STATE ================= */

let players = {};
let levels = {};

/* ================= HELPERS ================= */

const safeId = (s) =>
    encodeURIComponent(String(s ?? ""));

const uuid = () =>
    (crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now() + Math.random());

const fmt = (s) => {
    s = Math.max(0, s || 0);
    let h = Math.floor(s / 3600);
    let m = Math.floor((s % 3600) / 60);
    let sec = s % 60;
    return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
};

const left = (p) => {
    if (!p || !p.running || !p.last_update) return p.time || 0;
    return Math.max(0,
        (p.time || 0) - Math.floor((Date.now() - new Date(p.last_update)) / 1000)
    );
};

/* ================= LOAD ================= */

async function load(){
    try {
        const {data} = await db.from("timers").select("*");
        players = {};
        (data || []).forEach(p => players[p.id] = p);
    } catch(e){}
}

async function loadLevels(){
    try {
        const {data} = await db.from("levels").select("*");
        levels = {};
        (data || []).forEach(p => levels[p.id] = p);
    } catch(e){}
}

/* ================= SAVE ================= */

const save = (p) =>
    db.from("timers").upsert(p);

const saveLevel = (p) =>
    db.from("levels").upsert(p);

/* ================= RENDER PLAYERS ================= */

function createRow(p){

    const pid = safeId(p.id);

    const div = document.createElement("div");
    div.className = "player";
    div.id = "r_" + pid;

    div.innerHTML = `
        <div class="idx"></div>
        <div class="name"></div>
        <div class="time" id="t_${pid}">0</div>
        <div class="actions">
            <button id="b_${pid}"></button>
            <button class="small">+30m</button>
            <button class="small">+1h</button>
            <button class="del">🗑</button>
        </div>
    `;

    div.querySelector(".name").textContent = p.name || "";

    div.querySelectorAll(".small")[0].onclick = () => add30(p.id);
    div.querySelectorAll(".small")[1].onclick = () => add1h(p.id);
    div.querySelector(".del").onclick = () => removePlayer(p.id);

    const list = document.getElementById("list");
    if (list) list.appendChild(div);
}

/* ================= RENDER ================= */

function render(){

    const list = document.getElementById("list");
    if (!list) return;

    document.querySelectorAll(".player").forEach(r=>{
        if(r.id.startsWith("r_")){
            const rid = r.id.replace("r_","");
            if(!players[rid]) r.remove();
        }
    });

    Object.values(players).forEach(p=>{
        const pid = safeId(p.id);
        if(!document.getElementById("r_"+pid)) createRow(p);
    });
}

/* ================= TICK ================= */

function tick(){

    const arr = Object.values(players || {})
        .map(p => ({...p, remain:left(p)}))
        .sort((a,b)=>a.remain-b.remain);

    arr.forEach((p,i)=>{

        const pid = safeId(p.id);
        const row = document.getElementById("r_"+pid);
        if(!row) return;

        const list = document.getElementById("list");
        if (list) list.appendChild(row);

        const idx = row.querySelector(".idx");
        if (idx) idx.innerText = i+1;

        const timeEl = document.getElementById("t_"+pid);
        if (timeEl) timeEl.innerText = fmt(p.remain);

        const btn = document.getElementById("b_"+pid);

        if(btn){
            if(p.running){
                btn.innerText = "⏸";
                btn.onclick = () => pausePlayer(p.id);
            } else {
                btn.innerText = "▶";
                btn.onclick = () => resumePlayer(p.id);
            }
        }

        row.classList.remove("warn","danger");
        if(p.remain <= 300) row.classList.add("warn");
        if(p.remain <= 60) row.classList.add("danger");
    });
}

/* ================= LEVELS ================= */

function renderLevels(){

    const el = document.getElementById("levelList");
    if (!el) return;

    el.innerHTML = "";

    Object.values(levels || [])
        .sort((a,b)=>a.lvl_from-b.lvl_from)
        .forEach(p=>{

            const row = document.createElement("div");
            row.className = "player";

            row.innerHTML = `
                <div class="name"></div>
                <div>${p.lvl_from} → ${p.lvl_to}</div>
                <button class="del">🗑</button>
            `;

            row.querySelector(".name").textContent = p.name || "";
            row.querySelector(".del").onclick = () => removeLevel(p.id);

            el.appendChild(row);
        });
}

/* ================= ACTIONS ================= */

async function addPlayer(){

    const name = document.getElementById("name")?.value?.trim();
    const min = parseInt(document.getElementById("min")?.value);

    if(!name || Number.isNaN(min)) return;

    const p = {
        id: uuid(),
        name,
        time: min * 60,
        running: true,
        last_update: new Date().toISOString()
    };

    await save(p);
    await load();
    render();
}

async function pausePlayer(id){
    const p = players[id];
    if(!p) return;

    p.time = left(p);
    p.running = false;
    p.last_update = null;

    await save(p);
    await load();
    render();
}

async function resumePlayer(id){
    const p = players[id];
    if(!p) return;

    p.running = true;
    p.last_update = new Date().toISOString();

    await save(p);
    await load();
    render();
}

async function removePlayer(id){
    await db.from("timers").delete().eq("id", id);
    delete players[id];
    render();
}

async function add30(id){
    const p = players[id];
    if(!p) return;

    p.time = left(p) + 1800;
    p.running = true;
    p.last_update = new Date().toISOString();

    await save(p);
    await load();
    render();
}

async function add1h(id){
    const p = players[id];
    if(!p) return;

    p.time = left(p) + 3600;
    p.running = true;
    p.last_update = new Date().toISOString();

    await save(p);
    await load();
    render();
}

/* ================= LEVELS ================= */

async function addLevel(){

    const name = document.getElementById("lvlName")?.value?.trim();
    const from = parseInt(document.getElementById("lvlFrom")?.value);
    const to = parseInt(document.getElementById("lvlTo")?.value);

    if(!name || Number.isNaN(from) || Number.isNaN(to)) return;

    const l = {
        id: uuid(),
        name,
        lvl_from: from,
        lvl_to: to
    };

    await saveLevel(l);
    await loadLevels();
    renderLevels();
}

async function removeLevel(id){
    await db.from("levels").delete().eq("id", id);
    delete levels[id];
    renderLevels();
}

/* ================= REALTIME ================= */

db.channel("timers")
.on("postgres_changes",{event:"*",schema:"public",table:"timers"},async()=>{
    await load();
    render();
})
.subscribe();

db.channel("levels")
.on("postgres_changes",{event:"*",schema:"public",table:"levels"},async()=>{
    await loadLevels();
    renderLevels();
})
.subscribe();

/* ================= INIT ================= */

async function init(){
    await load();
    await loadLevels();
    render();
    renderLevels();
    setInterval(tick, 1000);
}

init();

});

</script>
