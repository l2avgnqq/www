<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXP L2 FIX</title>

<!-- Supabase -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
background:#0b1220;
color:#fff;
font-family:Arial;
padding:20px;
}

.layout{display:flex;gap:20px;}
.left{flex:1;}
.right{width:340px;background:#162033;padding:15px;border-radius:12px;}

.player{
background:#162033;
margin:8px 0;
padding:12px;
border-radius:12px;
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.idx{width:30px;}
.name{width:140px;font-weight:bold;}
.time{width:120px;color:#22c55e;font-size:20px;}

button{
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

.add{background:#2563eb;color:#fff}
.pause{background:#f59e0b}
.resume{background:#22c55e}
.del{background:#ef4444}
.small{background:#334155;color:#fff}
</style>
</head>

<body>

<div class="layout">

<div class="left">

<h2>EXP L2</h2>

<input id="name" placeholder="Имя">
<input id="min" type="number" placeholder="Мин">
<button class="add" onclick="addPlayer()">Добавить</button>

<br><br>

<button class="small" onclick="addAll()">+ всем</button>
<button class="pause" onclick="pauseAll()">⏸ всем</button>
<button class="resume" onclick="resumeAll()">▶ всем</button>

<br><br>

<div id="list"></div>

</div>

<div class="right">

<h3>Уровни</h3>

<input id="lvlName" placeholder="Ник"><br><br>
<input id="lvlFrom" type="number" placeholder="с лвл">
<input id="lvlTo" type="number" placeholder="до"><br><br>
<button class="add" onclick="addLevel()">Добавить</button>

<hr>

<div id="levelList"></div>

</div>

</div>

<script>

const db = supabase.createClient(
"https://mxwtlfkhykqegzytotlq.supabase.co",
"sb_publishable_-FajhSo3HLdy00i5VNemSA_89bLw5Qp"
);

/* ================= STATE ================= */

let players = {};
let levels = {};

/* ================= HELPERS ================= */

const id = s => encodeURIComponent(String(s));
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now());

const fmt = s => {
s = Math.max(0,s||0);
return `${Math.floor(s/3600)}:${String(Math.floor((s%3600)/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
};

const left = p => {
if(!p.running || !p.last_update) return p.time||0;
return Math.max(0,p.time - Math.floor((Date.now()-new Date(p.last_update))/1000));
};

/* ================= LOAD ================= */

async function load(){
const {data} = await db.from("timers").select("*");
players={};
(data||[]).forEach(p=>players[p.id]=p);
}

async function loadLevels(){
const {data} = await db.from("levels").select("*");
levels={};
(data||[]).forEach(p=>levels[p.id]=p);
}

/* ================= SAVE ================= */

const save = p => db.from("timers").upsert(p);
const saveLevel = p => db.from("levels").upsert(p);

/* ================= RENDER ================= */

function render(){

const list = document.getElementById("list");
list.innerHTML="";

Object.values(players).forEach((p,i)=>{

const pid = id(p.id);

const row = document.createElement("div");
row.className="player";

row.innerHTML=`
<div class="idx">${i+1}</div>
<div class="name">${p.name}</div>
<div class="time" id="t_${pid}">0</div>

<button onclick="toggle('${p.id}')">▶/⏸</button>
<button class="small" onclick="add30('${p.id}')">+30</button>
<button class="small" onclick="add1h('${p.id}')">+1h</button>
<button class="del" onclick="removeP('${p.id}')">🗑</button>
`;

list.appendChild(row);
});
}

/* ================= LEVELS ================= */

function renderLevels(){

const el=document.getElementById("levelList");
el.innerHTML="";

Object.values(levels).forEach(l=>{

const row=document.createElement("div");
row.className="player";

row.innerHTML=`
<div class="name">${l.name}</div>
<div>${l.lvl_from} → ${l.lvl_to}</div>
<button class="del" onclick="removeL('${l.id}')">🗑</button>
`;

el.appendChild(row);
});
}

/* ================= TICK ================= */

function tick(){

Object.values(players).forEach(p=>{
const el=document.getElementById("t_"+id(p.id));
if(el) el.innerText=fmt(left(p));
});

}

/* ================= ACTIONS ================= */

async function addPlayer(){

const name=document.getElementById("name").value.trim();
const min=parseInt(document.getElementById("min").value);

if(!name||isNaN(min)) return;

await save({
id:uuid(),
name,
time:min*60,
running:true,
last_update:new Date().toISOString()
});

await reload();
}

async function toggle(idv){
const p=players[idv];
p.time=left(p);
p.running=!p.running;
p.last_update=p.running?new Date().toISOString():null;
await save(p);
await reload();
}

async function add30(idv){
const p=players[idv];
p.time=left(p)+1800;
p.running=true;
await save(p);
await reload();
}

async function add1h(idv){
const p=players[idv];
p.time=left(p)+3600;
p.running=true;
await save(p);
await reload();
}

async function removeP(idv){
await db.from("timers").delete().eq("id",idv);
delete players[idv];
render();
}

/* ================= MASS ================= */

async function addAll(){
for(const p of Object.values(players)){
p.time=left(p)+300;
p.running=true;
await save(p);
}
await reload();
}

async function pauseAll(){
for(const p of Object.values(players)){
p.time=left(p);
p.running=false;
await save(p);
}
await reload();
}

async function resumeAll(){
for(const p of Object.values(players)){
p.running=true;
p.last_update=new Date().toISOString();
await save(p);
}
await reload();
}

/* ================= LEVELS ================= */

async function addLevel(){

const name=document.getElementById("lvlName").value.trim();
const from=parseInt(document.getElementById("lvlFrom").value);
const to=parseInt(document.getElementById("lvlTo").value);

if(!name||isNaN(from)||isNaN(to)) return;

await saveLevel({
id:uuid(),
name,
lvl_from:from,
lvl_to:to
});

await reload();
}

async function removeL(idv){
await db.from("levels").delete().eq("id",idv);
delete levels[idv];
renderLevels();
}

/* ================= RELOAD ================= */

async function reload(){
await load();
await loadLevels();
render();
renderLevels();
}

/* ================= INIT ================= */

async function init(){
await reload();
setInterval(tick,1000);
}

init();

</script>

</body>
</html>
