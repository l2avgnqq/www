<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXP L2</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
background:#0b1220;
color:#fff;
font-family:Arial;
padding:20px;
}

.layout{
display:flex;
gap:20px;
}

.left{flex:1;}

.right{
width:340px;
background:#162033;
padding:15px;
border-radius:12px;
height:fit-content;
}

.top{
text-align:center;
margin-bottom:20px;
}

.player{
background:#162033;
margin:8px 0;
padding:12px;
border-radius:12px;
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.warn{background:#3a2c00}
.danger{background:#4a1010}

.idx{width:30px;color:#94a3b8;font-weight:bold;}
.name{width:140px;font-weight:bold;}
.time{width:120px;font-size:22px;font-weight:bold;color:#22c55e;}

input{
padding:8px;
border:none;
border-radius:10px;
background:#111827;
color:white;
width:90px;
}

button{
border:none;
border-radius:10px;
padding:8px 10px;
cursor:pointer;
color:white;
font-weight:bold;
}

.add{background:#2563eb}
.pause{background:#f59e0b}
.resume{background:#22c55e}
.del{background:#ef4444}
.small{background:#334155;font-size:12px}
</style>
</head>

<body>

<div class="layout">

<div class="left">

<div class="top">

<h2>EXP L2</h2>

<input id="name" placeholder="Имя">
<input id="min" type="number" placeholder="Мин">
<button class="add" onclick="addPlayer()">Добавить</button>

<br><br>

<input id="all" type="number" placeholder="+ всем">
<button class="add" onclick="addAll()">+ всем</button>
<button class="pause" onclick="pauseAll()">⏸ всем</button>
<button class="resume" onclick="resumeAll()">▶ всем</button>

</div>

<div id="list"></div>

</div>

<div class="right">

<h3>Прокачка по lvl</h3>

<input id="lvlName" placeholder="Ник">

<div style="display:flex;gap:6px;">
<input id="lvlFrom" type="number" placeholder="с лвл" style="flex:1;">
<input id="lvlTo" type="number" placeholder="до лвл" style="flex:1;">
</div>

<button class="add" onclick="addLevel()">Добавить</button>

<hr>

<div id="levelList"></div>

</div>

</div>

<script>

const db = supabase.createClient(
"https://mxwtlfkhykqegzytotlq.supabase.co",
"sb_publishable_-FajhSo3HLdy00i5VNemSA_89bLw5Qp"
);

let players = {};
let levels = {};

/* ================= HELPERS ================= */

const id = s => encodeURIComponent(String(s));

const fmt = s => {
s=Math.max(0,s||0);
return `${Math.floor(s/3600)}:${String(Math.floor((s%3600)/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
};

const left = p => {
if(!p.running || !p.last_update) return p.time||0;
return Math.max(0,p.time - Math.floor((Date.now()-new Date(p.last_update))/1000));
};

/* ================= LOAD ================= */

async function load(){
const {data}=await db.from("timers").select("*");
players={};
(data||[]).forEach(p=>players[p.id]=p);
}

async function loadLevels(){
const {data}=await db.from("levels").select("*");
levels={};
(data||[]).forEach(p=>levels[p.id]=p);
}

/* ================= SAVE ================= */

const save = p => db.from("timers").upsert(p);
const saveLevel = p => db.from("levels").upsert(p);

/* ================= RENDER ================= */

function render(){

const list=document.getElementById("list");
list.innerHTML="";

Object.values(players).forEach((p,i)=>{

const pid=id(p.id);

const row=document.createElement("div");
row.className="player";

row.innerHTML=`
<div class="idx">${i+1}</div>
<div class="name">${p.name}</div>
<div class="time" id="t_${pid}">0</div>

<div class="actions">

<button id="b_${pid}"></button>
<button class="small" onclick="add30('${p.id}')">+30m</button>
<button class="small" onclick="add1h('${p.id}')">+1h</button>
<button class="del" onclick="removePlayer('${p.id}')">🗑</button>

</div>
`;

list.appendChild(row);
});
}

/* ================= LEVELS ================= */

function renderLevels(){

const el=document.getElementById("levelList");
el.innerHTML="";

Object.values(levels).forEach(l=>{

const row=document.createElement("div");
row.className="player";

row.innerHTML=`
<div class="name">${l.name}</div>
<div>${l.lvl_from} → ${l.lvl_to}</div>
<button class="del" onclick="removeLevel('${l.id}')">🗑</button>
`;

el.appendChild(row);
});
}

/* ================= TICK ================= */

function tick(){

Object.values(players).forEach(p=>{
const el=document.getElementById("t_"+id(p.id));
if(el) el.innerText=fmt(left(p));
});

}

/* ================= ACTIONS ================= */

async function addPlayer(){

const name=document.getElementById("name").value.trim();
const min=parseInt(document.getElementById("min").value);

if(!name||isNaN(min)) return;

await save({
id:crypto.randomUUID(),
name,
time:min*60,
running:true,
last_update:new Date().toISOString()
});

await load();
render();
}

async function add30(id){
const p=players[id];
p.time=left(p)+1800;
p.running=true;
await save(p);
await load();
render();
}

async function add1h(id){
const p=players[id];
p.time=left(p)+3600;
p.running=true;
await save(p);
await load();
render();
}

async function toggle(id){
const p=players[id];
p.time=left(p);
p.running=!p.running;
p.last_update=p.running?new Date().toISOString():null;
await save(p);
await load();
render();
}

/* ================= MASS ================= */

async function addAll(){
const v=parseInt(document.getElementById("all").value||0);
for(const p of Object.values(players)){
p.time=left(p)+(v||0)*60;
p.running=true;
await save(p);
}
await load();
render();
}

async function pauseAll(){
for(const p of Object.values(players)){
p.time=left(p);
p.running=false;
await save(p);
}
await load();
render();
}

async function resumeAll(){
for(const p of Object.values(players)){
p.running=true;
p.last_update=new Date().toISOString();
await save(p);
}
await load();
render();
}

/* ================= LEVELS ================= */

async function addLevel(){

const name=document.getElementById("lvlName").value.trim();
const from=parseInt(document.getElementById("lvlFrom").value);
const to=parseInt(document.getElementById("lvlTo").value);

if(!name||isNaN(from)||isNaN(to)) return;

await saveLevel({
id:crypto.randomUUID(),
name,
lvl_from:from,
lvl_to:to
});

await loadLevels();
renderLevels();
}

/* ================= REALTIME (ГЛАВНОЕ ИСПРАВЛЕНИЕ) ================= */

db.channel("timers")
.on("postgres_changes",{event:"*",schema:"public",table:"timers"},async()=>{
await load();
render();
})
.subscribe();

db.channel("levels")
.on("postgres_changes",{event:"*",schema:"public",table:"levels"},async()=>{
await loadLevels();
renderLevels();
})
.subscribe();

/* ================= INIT ================= */

async function init(){
await load();
await loadLevels();
render();
renderLevels();
setInterval(tick,1000);
}

init();

</script>

</body>
</html>
